# Naam van de applicatie
spring.application.name=cyberpunk-life-sim

# De API draait op http://localhost:8080
server.port=8080

# --- MySQL database ---
# createDatabaseIfNotExist=true maakt de database automatisch aan als die nog niet bestaat
spring.datasource.url=jdbc:mysql://localhost:3306/cyberpunk_life_sim?createDatabaseIfNotExist=true
# Pas deze twee aan naar jouw eigen MySQL gebruiker en wachtwoord
spring.datasource.username=root
spring.datasource.password=

# "update" laat Hibernate automatisch de tabellen maken/aanpassen op basis van de model-klassen
spring.jpa.hibernate.ddl-auto=update
# Zet op true als je de SQL-queries in de console wilt zien (handig om te leren)
spring.jpa.show-sql=false

# Laat de foutmelding (bijv. "Niet genoeg geld") zien in de JSON response
server.error.include-message=always
